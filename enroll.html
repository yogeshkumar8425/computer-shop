<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enroll in a course | Classroom</title>
<style>
:root{font-family:Arial,sans-serif;color:#192538;background:#f4f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #e3e8f1;border-radius:18px;padding:32px;box-shadow:0 16px 48px #263d6510}.brand{color:#4569e8;font-weight:700;font-size:20px}h1{margin:22px 0 8px;font-size:30px}.muted{color:#69778d;line-height:1.55}.details{background:#f6f8fc;border-radius:12px;padding:16px;margin:20px 0}.details p{margin:8px 0}.field{display:block;margin:16px 0}.field span{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #dfe4ed;border-radius:8px;font:inherit}.btn{display:block;width:100%;border:0;border-radius:9px;background:#4569e8;color:white;padding:14px;font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}.btn:disabled{opacity:.65;cursor:wait}.message{min-height:24px;color:#a23a3a;margin:8px 0}.success{color:#18734b}.hidden{display:none!important}.payment-note{font-size:13px;color:#69778d}
</style></head><body><main class="card"><div class="brand">▣ Classroom</div><section id="loading"><h1>Loading course…</h1></section><section id="courseView" class="hidden"><h1 id="courseName">Course enrollment</h1><p class="muted">Review the course and class schedule, then register your details.</p><div class="details"><p><b>Course fee:</b> <span id="fee"></span></p><p><b>Class timing:</b> <span id="timing"></span></p><p><b>Length:</b> <span id="length"></span></p></div><form id="enrollForm"><label class="field"><span>Student name</span><input name="name" autocomplete="name" required maxlength="120"></label><label class="field"><span>Mobile number</span><input name="phone" type="tel" autocomplete="tel" required maxlength="40"></label><label class="field"><span>Email address (optional)</span><input name="email" type="email" autocomplete="email" maxlength="254"></label><p id="message" class="message" role="status"></p><button class="btn" id="submit">Register for this class</button></form></section><section id="done" class="hidden"><h1>Registration received</h1><p class="muted">Your student record has been saved. Your payment is still pending until the institute confirms it.</p><p id="paymentNote" class="payment-note"></p><a id="pay" class="btn hidden" target="_blank" rel="noopener noreferrer">Pay course fee online</a></section></main>
<script>
const api=location.protocol==='file:'?'http://127.0.0.1:8000/api':'/api';const params=new URLSearchParams(location.search);const courseName=params.get('course');const $=s=>document.querySelector(s);const money=v=>'₹'+Number(v||0).toLocaleString('en-IN');let course;
(async()=>{try{if(!courseName)throw Error('This enrollment link is missing its course.');const r=await fetch(api+'/public/course?name='+encodeURIComponent(courseName));const d=await r.json();if(!r.ok)throw Error(d.error||'Course not found.');course=d;document.title=d.name+' | Enroll';$('#courseName').textContent=d.name;$('#fee').textContent=money(d.fee);$('#timing').textContent=d.timing;$('#length').textContent=`${d.classes} classes · ${Number(d.hours)*Number(d.classes)} total hours`;$('#loading').classList.add('hidden');$('#courseView').classList.remove('hidden')}catch(e){$('#loading').innerHTML='<h1>Course link unavailable</h1><p class="muted">'+e.message+'</p>'}})();
$('#enrollForm').addEventListener('submit',async e=>{e.preventDefault();const button=$('#submit'),message=$('#message');button.disabled=true;message.textContent='';try{const values=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch(api+'/public/enroll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...values,course:course.name})});const result=await r.json();if(!r.ok)throw Error(result.error||'Could not register.');$('#courseView').classList.add('hidden');$('#done').classList.remove('hidden');if(result.paymentUrl){$('#pay').href=result.paymentUrl;$('#pay').classList.remove('hidden');$('#paymentNote').textContent='Complete payment through the secure payment link. The institute will confirm payment and your seat.'}else{$('#paymentNote').textContent='Contact the institute to arrange course fee payment.'}}catch(err){message.textContent=err.message;button.disabled=false}});
</script></body></html>
